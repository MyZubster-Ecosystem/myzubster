  - Instagram
  - Facebook
  - LinkedIn
  - DEV Community
  - YouTube
  - approved community channels
deliverables:
  - Publish an accurate promotional contribution linking to the official prerelease.
  - Clearly identify the APK as a debug/development build when discussing release maturity.
  - Preserve concept-vs-evidence boundaries for any illustrative visual.
evidence_required:
  - Public post/content URL where applicable
  - Screenshot of publication
  - Platform analytics for metric-based rewards
  - Contributor identifier
  - Publication/completion date
acceptance_criteria:
  - Official GitHub prerelease is the destination or is clearly linked.
  - No claim that Debug Build 001 is production-ready.
  - No fabricated downloads, users, partnerships, endorsements or MYZ value claims.
  - Evidence is sufficient for independent maintainer review.
  - Engagement used for rewards is not known or suspected to be artificial.
stacking:
  allowed: true
  rule: Distinct eligible outcomes may stack when each threshold has independent sufficient evidence; the same proof must not be counted twice for the same reward tier.
verifier: maintainer-review
policy:
  - docs/MYZ_ADS_BOUNTY.md
  - docs/marketing/README.md
