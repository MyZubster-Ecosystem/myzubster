id: MYZ-ADS-001
title: Promote MyZubster Google TV Debug Build 001
status: open
category: marketing
created_at: 2026-08-23
owner: MyZubster
reward:
  unit: MYZ
  base_social_post: 10
  approved_original_creative: 15
  valid_clicks_100: 20
  verified_views_500: 25
  verified_views_1000: 40
  short_video: 30-50
  qualified_lead: 50
  kpi_bonus: 50-100
objective: Increase verifiable awareness, qualified traffic and testing interest for the MyZubster Google TV Debug Build 001.
destination:
