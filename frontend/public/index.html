<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071018" />
  <meta name="description" content="MyZubster è un ecosistema open source per territorio, ambiente, robotica, identità digitali e contributi verificabili." />
  <meta name="robots" content="index,follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="it_IT" />
  <meta property="og:site_name" content="MyZubster" />
  <meta property="og:title" content="MyZubster — Open Source, Territorio e Comunità" />
  <meta property="og:description" content="Osserva, crea e contribuisci a un ecosistema open source costruito in pubblico." />
  <meta property="og:url" content="https://www.myzubster.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="MyZubster — Open Source, Territorio e Comunità" />
  <meta name="twitter:description" content="Osserva, crea e contribuisci a un ecosistema open source costruito in pubblico." />
  <title>MyZubster — Open Source, Territorio e Comunità</title>
  <script>
    (() => {
      const rawPath = window.location.pathname.replace(/\/+$/, '') || '/';
      const canonicalPath = rawPath === '/index.html' ? '/' : rawPath;
      const canonicalUrl = `https://www.myzubster.com${canonicalPath === '/' ? '/' : canonicalPath}`;
      const canonical = document.createElement('link');
      canonical.rel = 'canonical';
      canonical.href = canonicalUrl;
      document.head.appendChild(canonical);
      const ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.setAttribute('content', canonicalUrl);
    })();
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <noscript>Abilita JavaScript per usare MyZubster.</noscript>
  <div id="root"></div>
</body>
</html>
