name: Android TV Build

on:
  pull_request:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myzubster-tv-debug-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
