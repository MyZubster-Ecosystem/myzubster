name: CI – Test e Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Installa dipendenze backend
        run: npm ci

      - name: Rigenera lockfile frontend
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Installa dipendenze frontend da lockfile rigenerato
        working-directory: frontend
        run: npm ci

      - name: Esporta lockfile rigenerato
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock-regenerated
          path: frontend/package-lock.json
          if-no-files-found: error

      - name: Lint backend
        run: npm run lint --if-present

      - name: Unit test backend
        run: npm test -- --testPathIgnorePatterns=/frontend/

      - name: Unit test frontend
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build backend
        run: npm run build --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build
