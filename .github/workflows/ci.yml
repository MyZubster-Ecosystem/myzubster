name: CI – Test e Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# TEMPORARY bootstrap permission: this branch-only CI run regenerates and commits
# frontend/package-lock.json from frontend/package.json. This is reverted to
# contents: read immediately after the generated lockfile lands.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Installa dipendenze backend
        run: npm ci

      - name: Rigenera e committa lockfile frontend
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm install --package-lock-only --no-audit --no-fund --prefix frontend
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "fix(ci): sync frontend lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Installa dipendenze frontend
        working-directory: frontend
        run: npm ci

      - name: Lint backend
        run: npm run lint --if-present

      - name: Unit test backend
        run: npm test -- --testPathIgnorePatterns=/frontend/

      - name: Unit test frontend
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build backend
        run: npm run build --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build
