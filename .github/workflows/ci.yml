name: CI – Test e Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Installa dipendenze backend
        run: npm ci

      - name: Installa dipendenze frontend
        working-directory: frontend
        # Known baseline drift: frontend/package.json declares Leaflet packages
        # not yet represented in frontend/package-lock.json. A regenerated lock
        # file has been verified in CI and archived as artifact 9508384152.
        # Keep npm install here until that exact generated lockfile can be
        # committed, then restore this step to plain `npm ci`.
        run: npm install --no-audit --no-fund

      - name: Lint backend
        run: npm run lint --if-present

      - name: Unit test backend
        run: npm test -- --testPathIgnorePatterns=/frontend/

      - name: Unit test frontend
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build backend
        run: npm run build --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build
