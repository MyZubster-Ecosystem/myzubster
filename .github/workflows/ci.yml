name: CI – Test e Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true

# Keep the full repository CI as the release gate; MYZ-164 also has a focused Seller Free regression workflow.
jobs:
  test:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Installa dipendenze backend
        run: npm ci

      - name: Installa dipendenze frontend
        working-directory: frontend
        run: npm ci

      - name: Lint backend
        run: npm run lint --if-present

      - name: Unit test backend
        run: npm test -- --runInBand --testPathIgnorePatterns=/frontend/

      - name: Unit test frontend
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build backend
        run: npm run build --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            coverage/
            frontend/coverage/
            *.log
          retention-days: 7
          if-no-files-found: ignore

  notify:
    name: Build notifications
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          BUILD_STATUS: ${{ needs.test.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then exit 0; fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"MyZubster CI: $BUILD_STATUS — $GITHUB_REPOSITORY@$GITHUB_SHA\"}" \
            "$SLACK_WEBHOOK"

      - name: Send Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_STATUS: ${{ needs.test.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=MyZubster CI: ${BUILD_STATUS} — ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

  dependency-remediation-pr1679:
    name: Remediate vulnerable dependencies (PR 1679 only)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1679 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/preview-google-oauth-origin-20261031'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-google-oauth-origin-20261031
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Update security-constrained dependency manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.dependencies.nodemailer = '^10.1.4';
          pkg.overrides = {
            ...pkg.overrides,
            qs: '^6.16.1',
            'body-parser': '^1.20.9',
            'follow-redirects': '^1.16.2',
            'ip-address': '^10.7.4',
            '@vercel/cli-config': { zod: '^4.6.6' }
          };
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify lockfile, production audit and OAuth regression
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm test -- --runInBand --testPathIgnorePatterns=/frontend/
        env:
          CI: 'true'
          NODE_ENV: test
      - name: Commit validated dependency changes to PR branch only
        run: |
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): remediate audited production dependencies for PR 1679'
          git push origin HEAD:fix/preview-google-oauth-origin-20261031
