name: Production Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Permette l'esecuzione manuale

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check API Health (root)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }}/)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check FAILED on root with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Root health check OK: HTTP $HTTP_CODE"

      - name: Check API Endpoints
        run: |
          for endpoint in "/api/health" "/api/status"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }}$endpoint)
            echo "$endpoint: HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "❌ $endpoint returned $CODE"
              exit 1
            fi
          done
          echo "✅ All API endpoints are healthy"

      - name: Check Latency
        run: |
          TIME=$(curl -s -o /dev/null -w "%{time_total}" ${{ secrets.APP_URL }}/api/health)
          echo "Latency: ${TIME}s"
          if (( $(echo "$TIME > 2.0" | bc -l) )); then
            echo "⚠️ High latency detected: ${TIME}s"
          else
            echo "✅ Latency OK"
          fi
