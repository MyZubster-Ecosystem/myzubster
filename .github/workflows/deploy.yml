name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Vercel token
        id: vercel_token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not configured; skipping CLI deployment. Configure the repository secret to enable Vercel deploys."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Vercel CLI
        if: steps.vercel_token.outputs.available == 'true'
        run: npm install -g vercel
      - name: Enable Vercel Web Analytics
        if: steps.vercel_token.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel project web-analytics my-zubster-app --scope Myzubster --token "$VERCEL_TOKEN" --format json
      - name: Deploy to Vercel
        if: steps.vercel_token.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel --prod --token "$VERCEL_TOKEN"
