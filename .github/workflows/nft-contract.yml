name: NFT Contract

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/deploy-character-nft.cjs'
      - 'hardhat.config.cjs'
      - 'package.json'
      - '.github/workflows/nft-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Compile Character NFT
        run: npm run nft:compile
