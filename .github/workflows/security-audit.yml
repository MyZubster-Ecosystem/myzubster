name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without nested submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Gate production dependencies (high/critical)
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit-runtime.json
          status=$?
          cat npm-audit-runtime.json
          exit $status

      - name: Report full dependency audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-full.json || true
          cat npm-audit-full.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit-runtime.json
            npm-audit-full.json
          if-no-files-found: ignore
