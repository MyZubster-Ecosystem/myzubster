name: Zorgax Character Onboarding

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  propose-from-claim:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, 'CLAIM')
    runs-on: ubuntu-latest
    steps:
      - name: Propose optional MyZubster character
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.payload.comment.user.login;
            const issue = context.payload.issue;
            const sourceUrl = issue.html_url;
            const marker = `<!-- zorgax-character-proposal:${actor}:${issue.number} -->`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            if (comments.some(c => (c.body || '').includes(marker))) return;

            const body = `${marker}\n🤖 **Zorgax Character Draft — optional**\n\n@${actor}, your public CLAIM can become a MyZubster character linked to your GitHub contribution. Nothing is registered automatically.\n\n**Draft**\n- alias: \`@${actor}\`\n- character_name: \`${actor}\`\n- role: \`Contributor / ${issue.title}\`\n- status: \`PROPOSED\`\n- source: ${sourceUrl}\n- identity_scope: public GitHub alias only\n\nThis does **not** imply KYC, legal identity verification, employment, payment, partnership, endorsement or ownership.\n\nIf you want this draft added to the public Character Registry, reply in this thread with exactly:\n\n\`ACCEPT CHARACTER\`\n\nYou can also ignore this message or write \`SKIP CHARACTER\`. After registration, you can propose a custom name, role, lore or visual through a normal reviewed contribution.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });

  propose-from-pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Propose optional character from PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const actor = pr.user.login;
            const marker = `<!-- zorgax-character-proposal:${actor}:pr-${pr.number} -->`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });
            if (comments.some(c => (c.body || '').includes(marker))) return;

            const body = `${marker}\n🤖 **Zorgax Character Draft — optional**\n\n@${actor}, thanks for opening this contribution. You can optionally represent your public contributor alias as a MyZubster character.\n\n**Draft**\n- alias: \`@${actor}\`\n- character_name: \`${actor}\`\n- role: \`Contributor / ${pr.title}\`\n- status: \`PROPOSED\`\n- source: ${pr.html_url}\n- identity_scope: public GitHub alias only\n\nNo character is registered unless you explicitly opt in. This does **not** imply KYC, legal identity verification, employment, payment, partnership, endorsement or ownership.\n\nTo opt in, reply here with exactly \`ACCEPT CHARACTER\`. To decline, ignore this message or write \`SKIP CHARACTER\`.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });

  accept-character:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.body == 'ACCEPT CHARACTER'
    runs-on: ubuntu-latest
    steps:
      - name: Register accepted character proposal
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.payload.comment.user.login;
            const sourceIssue = context.payload.issue;
            const sourceUrl = context.payload.comment.html_url;
            const registryIssue = 617;
            const marker = `<!-- zorgax-character-accepted:${actor}:source-comment-${context.payload.comment.id} -->`;

            const { data: registryComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: registryIssue,
              per_page: 100
            });
            if (registryComments.some(c => (c.body || '').includes(marker))) return;

            const title = sourceIssue.title || 'MyZubster contribution';
            const body = `${marker}\n### Character proposal — @${actor}\n\n- **Alias:** @${actor}\n- **Character name:** ${actor}\n- **Role:** Contributor / ${title}\n- **Status:** \`PROPOSED\`\n- **Source contribution:** ${sourceUrl}\n- **Consent:** explicit \`ACCEPT CHARACTER\` by @${actor}\n- **Identity scope:** public GitHub alias only\n- **Generated by:** Zorgax Character Onboarding\n\nThis record is a public contributor-character proposal. It is **not** KYC, legal identity verification, employment, payment, partnership, endorsement or ownership. A later reviewed contribution may customize the character and may upgrade contributor status only when evidence supports it.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: registryIssue,
              body
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: sourceIssue.number,
              body: `✅ @${actor}, your opt-in was recorded in Character Registry #${registryIssue} with status \`PROPOSED\`. You can now customize the character through a reviewed issue/PR. Registration does not imply identity verification, employment, payment or partnership.`
            });
