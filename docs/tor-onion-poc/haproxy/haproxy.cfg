global
    log stdout format raw local0 info
    maxconn 1024

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-server-close
    timeout connect 5s
    timeout client  50s
    timeout server  50s

resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    accepted_payload_size 8192

frontend ft_onion
    bind :80
    mode http

    # Inbound header sanitization - strip client and proxy metadata
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Server
    http-request del-header X-Forwarded-Port
    http-request del-header X-Real-IP
    http-request del-header Forwarded
    http-request del-header Client-IP
    http-request del-header True-Client-IP
    http-request del-header X-Client-IP
    http-request del-header X-Originating-IP
    http-request del-header CF-Connecting-IP
    http-request del-header Fastly-Client-IP
    http-request del-header Incap-Client-IP
    http-request del-header X-Cluster-Client-IP
    http-request del-header Via
    http-request del-header X-Request-ID
    http-request del-header X-Correlation-ID

    # Outbound header sanitization - suppress server fingerprints
    http-response del-header Server
    http-response del-header X-Powered-By
    http-response del-header X-AspNet-Version
    http-response del-header X-Runtime
    http-response set-header Server "Protected-Onion-Service"

    default_backend bk_upstream

backend bk_upstream
    mode http
    balance roundrobin
    server upstream_srv upstream:8080 check inter 1s fall 2 rise 1 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
