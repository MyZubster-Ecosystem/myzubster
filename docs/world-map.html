<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyZubster World Visual Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; }
    #map { height: 100%; width: 100%; }
    .popup-title { font-weight: 700; margin-bottom: 6px; }
    .popup-meta { margin-top: 4px; font-size: 0.92rem; }
    .popup-links a { display: inline-block; margin-right: 10px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { worldCopyJump: true }).setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch('../data/observations.geojson')
      .then(r => r.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.marker(latlng),
          onEachFeature: (feature, marker) => {
            const p = feature.properties || {};
            const coords = p.latitude != null && p.longitude != null
              ? `<div class="popup-meta">GPS: ${p.latitude}, ${p.longitude}</div>`
              : '';
            const address = p.address ? `<div>${p.address}</div>` : '';
            const category = p.category ? `<div class="popup-meta">Category: ${p.category}</div>` : '';
            const media = p.media_type ? `<div class="popup-meta">Media: ${p.media_type}</div>` : '';
            const status = p.coordinate_status ? `<div class="popup-meta">Coordinate status: ${p.coordinate_status}</div>` : '';
            const links = `
              <div class="popup-links">
                ${p.google_maps ? `<a href="${p.google_maps}" target="_blank" rel="noopener">Open position in Google Maps</a>` : ''}
                ${p.github_record ? `<a href="${p.github_record}" target="_blank" rel="noopener">GitHub record</a>` : ''}
              </div>`;
            marker.bindPopup(`
              <div class="popup-title">${p.name || p.id || 'MyZubster observation'}</div>
              ${address}${coords}${category}${media}${status}${links}`);
          }
        }).addTo(map);

        if (layer.getBounds().isValid()) {
          map.fitBounds(layer.getBounds().pad(0.25));
        }
      })
      .catch(err => {
        console.error('Failed to load MyZubster observations:', err);
      });
  </script>
</body>
</html>
