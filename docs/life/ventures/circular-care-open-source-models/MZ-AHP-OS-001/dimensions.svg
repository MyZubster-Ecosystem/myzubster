<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">MZ-AHP-OS-001 Circular Baby Diaper — Draft Dimension Envelope</title>
  <desc id="desc">Open-source reference drawing. Draft prototype envelope only; not validated for production, fit, safety or performance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .outline{fill:none;stroke:#111;stroke-width:3}.core{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:8 6}.dim{stroke:#333;stroke-width:1.8;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#999;stroke-width:1;stroke-dasharray:4 4}.txt{font-family:Arial,sans-serif;font-size:18px;fill:#111}.small{font-family:Arial,sans-serif;font-size:14px;fill:#333}.warn{font-family:Arial,sans-serif;font-size:16px;font-weight:bold;fill:#111}
  </style>
  <text x="40" y="42" class="txt" font-weight="bold">MZ-AHP-OS-001 · Circular Baby Diaper · v0.2-draft</text>
  <text x="40" y="68" class="warn">DRAFT ENVELOPE — NOT FOR PRODUCTION OR CERTIFICATION</text>
  <text x="40" y="92" class="small">Nominal geometry is a prototype starting point only. Fit, tolerances, materials and performance require qualified validation.</text>

  <!-- simplified top-view body shape -->
  <path class="outline" d="M340 140 Q290 165 285 220 L300 300 Q310 350 300 400 L285 480 Q290 535 340 560 L660 560 Q710 535 715 480 L700 400 Q690 350 700 300 L715 220 Q710 165 660 140 Z"/>
  <rect x="445" y="185" width="110" height="330" rx="22" class="core"/>
  <text x="455" y="360" class="small" transform="rotate(-90 455 360)">nominal absorbent core envelope 360 × 110 mm</text>

  <!-- overall length -->
  <line x1="770" y1="140" x2="770" y2="560" class="dim"/>
  <line x1="715" y1="140" x2="790" y2="140" class="guide"/>
  <line x1="715" y1="560" x2="790" y2="560" class="guide"/>
  <text x="790" y="355" class="txt">450 mm overall length</text>

  <!-- rear width -->
  <line x1="340" y1="115" x2="660" y2="115" class="dim"/>
  <line x1="340" y1="115" x2="340" y2="145" class="guide"/>
  <line x1="660" y1="115" x2="660" y2="145" class="guide"/>
  <text x="430" y="105" class="txt">320 mm rear panel</text>

  <!-- front width -->
  <line x1="350" y1="590" x2="650" y2="590" class="dim"/>
  <line x1="350" y1="555" x2="350" y2="605" class="guide"/>
  <line x1="650" y1="555" x2="650" y2="605" class="guide"/>
  <text x="420" y="620" class="txt">300 mm front panel</text>

  <!-- crotch width -->
  <line x1="425" y1="350" x2="575" y2="350" class="dim"/>
  <text x="430" y="335" class="txt">150 mm crotch</text>

  <!-- labels -->
  <line x1="275" y1="235" x2="180" y2="205" class="guide"/>
  <text x="45" y="205" class="txt">rear/waist zone</text>
  <line x1="300" y1="350" x2="170" y2="350" class="guide"/>
  <text x="45" y="345" class="txt">leg/crotch zone</text>
  <line x1="300" y1="500" x2="180" y2="530" class="guide"/>
  <text x="45" y="535" class="txt">front/landing zone</text>

  <text x="40" y="670" class="small">Reference: MZ-AHP-OS-001 material-passport.json · Geometry status: DRAFT_ENVELOPE_NOT_VALIDATED</text>
</svg>
