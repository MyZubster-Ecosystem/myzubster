<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Provenance Inspector</title><style>body{font-family:system-ui;background:#0b0f14;color:#e6edf3;margin:0}main{max-width:1100px;margin:auto;padding:32px}h1{margin-bottom:8px}.sub{color:#9fb0c0}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select{background:#111820;color:#e6edf3;border:1px solid #2b3744;border-radius:8px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{border:1px solid #283341;border-radius:12px;padding:16px;background:#10161d}.meta{font-size:.9rem;color:#9fb0c0}.badge{display:inline-block;border:1px solid #3b4a5a;border-radius:999px;padding:3px 8px;margin:2px 4px 2px 0;font-size:.78rem}.claim{margin:12px 0}.note{font-size:.9rem;color:#c5d0da}.empty{color:#9fb0c0}a{color:#79c0ff}</style></head><body><main><h1>#018 Evidence Provenance Inspector</h1><p class="sub">Trace every claim back to its canonical public evidence record. This view reads <code>../data/evidence.json</code> and never upgrades a claim beyond the source.</p><div class="controls"><input id="q" placeholder="Search claim, title, ID…"><select id="type"><option value="">All types</option></select><select id="state"><option value="">All world states</option></select></div><div id="records" class="grid"></div><p id="empty" class="empty" hidden>No matching evidence records.</p></main><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let data=[];const q=document.getElementById('q'),type=document.getElementById('type'),state=document.getElementById('state'),records=document.getElementById('records'),empty=document.getElementById('empty');function render(){const term=q.value.toLowerCase();const rows=data.filter(r=>(!type.value||r.type===type.value)&&(!state.value||r.world_state===state.value)&&(!term||JSON.stringify(r).toLowerCase().includes(term)));records.innerHTML=rows.map(r=>`<article class="card"><div class="meta">${esc(r.date)} · ${esc(r.type)} · ${esc(r.id)}</div><h2>${esc(r.title)}</h2><div><span class="badge">World: ${esc(r.world_state)}</span><span class="badge">Adoption: ${esc(r.adoption_stage)}</span>${r.character_status?`<span class="badge">Character: ${esc(r.character_status)}</span>`:''}</div><p class="claim"><strong>Claim:</strong> ${esc(r.claim)}</p><p><strong>Evidence:</strong> <a href="${esc(r.evidence_url)}">${esc(r.evidence_label)}</a></p><p class="note"><strong>Interpretation limit:</strong> ${esc(r.note)}</p></article>`).join('');empty.hidden=rows.length!==0}fetch('../data/evidence.json').then(r=>r.json()).then(j=>{data=j.records||[];[...new Set(data.map(r=>r.type).filter(Boolean))].sort().forEach(v=>type.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));[...new Set(data.map(r=>r.world_state).filter(Boolean))].sort().forEach(v=>state.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));render()}).catch(()=>{empty.hidden=false;empty.textContent='Could not load evidence.json.'});[q,type,state].forEach(el=>el.addEventListener('input',render));</script></body></html>
