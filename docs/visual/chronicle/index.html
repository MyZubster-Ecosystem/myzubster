<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyZubster Chronicle</title><style>body{margin:0;background:#050816;color:#eef8ff;font-family:system-ui,sans-serif}.shell{max-width:1120px;margin:auto;padding:32px}.hero,.event{background:#0b1024;border:1px solid #254767;border-radius:18px;padding:22px}.hero{border-color:#ff49d1;margin-bottom:20px}.timeline{display:grid;gap:14px}.event{display:grid;grid-template-columns:130px 1fr auto;gap:18px;align-items:start}.date{color:#65eaff}.state{font-weight:800;color:#50ef9a}.meta{color:#9db4c8;font-size:.9rem}a{color:#65eaff}.evidence{white-space:nowrap}@media(max-width:720px){.event{grid-template-columns:1fr}.evidence{white-space:normal}}</style></head><body><main class="shell"><section class="hero"><p>ZORGAX CHRONICLE · EVIDENCE-FIRST</p><h1>The story is generated from public evidence records</h1><p>Only records flagged for Chronicle appear here. Narrative visuals may illustrate events, but evidence links define what can be claimed.</p><p><a href="../world-state/index.html">World State</a> · <a href="../adoption-ladder/index.html">Adoption Ladder</a> · <a href="../index.html">Visual Hub</a></p></section><section class="timeline" id="timeline">Loading Chronicle…</section></main><script>fetch('../data/evidence.json').then(r=>r.json()).then(data=>{const records=(data.records||[]).filter(r=>r.chronicle).sort((a,b)=>(b.date||'').localeCompare(a.date||''));document.getElementById('timeline').innerHTML=records.map(r=>`<article class="event"><div><div class="date">${r.date||'undated'}</div><div class="meta">${r.type}</div></div><div><h2>${r.title}</h2><p>${r.claim}</p><p class="meta">World State: <span class="state">${r.world_state}</span> · Adoption: ${r.adoption_stage}</p><p class="meta">${r.note||''}</p></div><div class="evidence"><a href="${r.evidence_url}">${r.evidence_label} ↗</a></div></article>`).join('')||'<p>No Chronicle records yet.</p>'}).catch(()=>document.getElementById('timeline').textContent='Unified evidence data could not be loaded.');</script></body></html>
