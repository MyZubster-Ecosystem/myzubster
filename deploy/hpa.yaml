# Horizontal Pod Autoscaler for the MyZubster API (issue #99).
# Requires the metrics-server (or Prometheus Adapter) in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myzubster-api
  labels:
    app.kubernetes.io/name: myzubster-api
    app.kubernetes.io/part-of: myzubster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myzubster-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
