<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MyZubster ecosystem architecture</title><desc id="desc">Canonical evidence-first architecture from users through app and web, core services, public snapshots, and a separately verified settlement boundary.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#140722"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif" fill="#eafcff"><text x="80" y="88" font-size="48" font-weight="700">MYZUBSTER // ECOSYSTEM MAP</text><text x="80" y="126" font-size="20" fill="#73f7ff">OPEN SOURCE · EVIDENCE FIRST · PRIVACY AWARE</text></g>
<g stroke="#39e7ff" stroke-width="3" fill="#0c1a2b"><rect x="90" y="190" width="300" height="100" rx="18"/><rect x="460" y="190" width="300" height="100" rx="18"/><rect x="830" y="190" width="300" height="100" rx="18"/><rect x="1200" y="190" width="300" height="100" rx="18"/></g>
