<rect x="160" y="600" width="1280" height="190" rx="24" fill="#160d22" stroke="#ff4ee8" stroke-width="3"/><text x="200" y="650" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#ff73ec">SEPARATE SETTLEMENT BOUNDARY</text><g font-family="Inter,Arial,sans-serif" text-anchor="middle" fill="#fff"><text x="350" y="720" font-size="22">CORE</text><text x="650" y="720" font-size="22">GATEWAY</text><text x="950" y="720" font-size="22">PAYMENT ADAPTER</text><text x="1250" y="720" font-size="22">INDEPENDENT VERIFIER</text></g><g stroke="#ff4ee8" stroke-width="4"><path d="M430 713H560"/><path d="M740 713H840"/><path d="M1060 713H1130"/></g><g fill="#ff4ee8"><path d="M555 703l18 10-18 10z"/><path d="M835 703l18 10-18 10z"/><path d="M1125 703l18 10-18 10z"/></g><text x="800" y="840" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9bdce4">A PR, merge, ledger entry or CID is not proof of external settlement. Verification remains explicit.</text></svg>