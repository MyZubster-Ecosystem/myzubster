<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">MyZubster contributor evidence flow</title><desc id="d">Contributor flow from mission and claim through contribution, evidence, review, merge, and optional reward or settlement.</desc><rect width="1600" height="720" rx="32" fill="#07111f"/><text x="70" y="80" font-family="Inter,Arial" font-size="44" font-weight="700" fill="#fff">MYZUBSTER // CONTRIBUTOR FLOW</text><text x="70" y="118" font-family="Inter,Arial" font-size="19" fill="#55f2ff">BUILD WHAT CAN BE REVIEWED · PROVE WHAT CAN BE VERIFIED</text><g font-family="Inter,Arial" text-anchor="middle"><g fill="#0d2032" stroke="#42e8ff" stroke-width="3"><rect x="60" y="220" width="190" height="110" rx="18"/><rect x="280" y="220" width="190" height="110" rx="18"/><rect x="500" y="220" width="190" height="110" rx="18"/><rect x="720" y="220" width="190" height="110" rx="18"/><rect x="940" y="220" width="190" height="110" rx="18"/><rect x="1160" y="220" width="190" height="110" rx="18"/><rect x="1380" y="220" width="160" height="110" rx="18"/></g><g fill="#fff" font-size="22" font-weight="700"><text x="155" y="270">MISSION</text><text x="375" y="270">CLAIM</text><text x="595" y="270">CONTRIBUTE</text><text x="815" y="270">EVIDENCE</text><text x="1035" y="270">REVIEW</text><text x="1255" y="270">MERGE</text><text x="1460" y="270">STATE</text></g><g fill="#9bdce4" font-size="15"><text x="155" y="300">scope + criteria</text><text x="375" y="300">public intent</text><text x="595" y="300">code / docs / visual</text><text x="815" y="300">tests + provenance</text><text x="1035" y="300">human + CI</text><text x="1255" y="300">accepted change</text><text x="1460" y="300">documented</text></g></g><g stroke="#ff4de1" stroke-width="4" fill="#ff4de1"><path d="M250 275H280M470 275H500M690 275H720M910 275H940M1130 275H1160M1350 275H1380"/></g><rect x="280" y="440" width="1040" height="170" rx="22" fill="#160c22" stroke="#ff4de1" stroke-width="3"/><text x="800" y="490" text-anchor="middle" font-family="Inter,Arial" font-size="23" font-weight="700" fill="#ff72e8">OPTIONAL REWARD / SETTLEMENT</text><text x="800" y="535" text-anchor="middle" font-family="Inter,Arial" font-size="19" fill="#fff">MERGE ≠ PAYMENT · MYZ = INTERNAL REWARD/ACCOUNTING · EXTERNAL RAILS REQUIRE INDEPENDENT VERIFICATION</text><text x="800" y="575" text-anchor="middle" font-family="Inter,Arial" font-size="17" fill="#a9cbd2">Character onboarding is also optional: Zorgax draft → explicit ACCEPT CHARACTER → PROPOSED registry entry.</text><text x="800" y="675" text-anchor="middle" font-family="Inter,Arial" font-size="17" fill="#55f2ff">Evidence first. Privacy by design. No secrets or unnecessary personal data.</text></svg>