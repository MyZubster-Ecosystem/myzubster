<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyZubster · Test SMTP Admin</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:#050b16;color:#f7f9fc}.wrap{max-width:680px;margin:auto;padding:32px 20px}.card{background:#0d1828;border:1px solid #263a55;border-radius:24px;padding:28px}h1{font-size:2rem;margin:0 0 12px}p{color:#b8c3d4;line-height:1.55}button{border:0;border-radius:14px;padding:15px 20px;font-size:1rem;font-weight:800;color:white;background:linear-gradient(90deg,#7147ee,#078bd1);cursor:pointer}button:disabled{opacity:.6}.status{margin-top:18px;padding:14px;border-radius:12px;background:#111f32;white-space:pre-wrap}.ok{border:1px solid #3a8}.bad{border:1px solid #d66}code{word-break:break-all}</style>
</head>
<body><main class="wrap"><section class="card">
<h1>Test notifica SMTP</h1>
<p>Area amministrativa MyZubster. Il pulsante usa la sessione già salvata nel browser e chiama l'endpoint protetto. Non mostra né invia al browser le credenziali SMTP.</p>
<button id="send">Invia email SMTP di test</button>
<div id="status" class="status">Pronto per il test.</div>
</section></main>
<script>
const button=document.getElementById('send');const status=document.getElementById('status');
function token(){return localStorage.getItem('myzubster-token')||localStorage.getItem('token')||localStorage.getItem('accessToken')||sessionStorage.getItem('token')||'';}
button.addEventListener('click',async()=>{
 const jwt=token();
 if(!jwt){status.className='status bad';status.textContent='Sessione MyZubster non trovata. Accedi prima con il tuo account admin.';return;}
 button.disabled=true;status.className='status';status.textContent='Invio in corso…';
 try{
  const response=await fetch('/api/admin/dashboard/notifications/email/test',{method:'POST',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'}});
  let data={};try{data=await response.json();}catch(_){ }
  if(response.ok&&data.success){status.className='status ok';status.textContent='Email accettata dal servizio SMTP.\nMessage ID: '+(data.messageId||'non disponibile');}
  else{status.className='status bad';status.textContent='Test non riuscito ('+response.status+'). '+(data.reason||data.error||'Controlla i log Vercel.');}
 }catch(error){status.className='status bad';status.textContent='Errore di rete durante il test: '+error.message;}
 finally{button.disabled=false;}
});
</script></body></html>
