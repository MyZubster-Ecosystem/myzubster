<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyZubster AI 👽</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, #302b63 0%, #0f0c29 55%, #05030d 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.chat {
  width: 100%;
  max-width: 900px;
  height: 90vh;
  max-height: 850px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: rgba(20, 15, 45, .94);
  border: 1px solid rgba(168, 85, 247, .35);
  border-radius: 24px;
  box-shadow: 0 30px 90px rgba(0,0,0,.6);
}

.header {
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
  font-size: 42px;
}

.title {
  font-size: 24px;
  font-weight: 700;
}

.subtitle {
  color: rgba(255,255,255,.55);
  font-size: 13px;
  margin-top: 4px;
}

.online {
  margin-left: auto;
  color: #4ade80;
  font-size: 13px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 25px;
}

.msg {
  max-width: 80%;
  margin-bottom: 16px;
  padding: 14px 17px;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.bot {
  background: rgba(168,85,247,.13);
  border: 1px solid rgba(168,85,247,.25);
}

.user {
  margin-left: auto;
  background: linear-gradient(135deg,#7c3aed,#db2777);
}

.input {
  padding: 18px;
  display: flex;
  gap: 10px;
  border-top: 1px solid rgba(255,255,255,.08);
}

textarea {
  flex: 1;
  resize: none;
  min-height: 54px;
  max-height: 150px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 15px;
  padding: 15px;
  background: rgba(0,0,0,.3);
  color: white;
  font-size: 15px;
  outline: none;
}

textarea:focus {
  border-color: #a855f7;
}

button {
  border: 0;
  border-radius: 15px;
  padding: 0 24px;
  background: linear-gradient(135deg,#a855f7,#ec4899);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

@media(max-width:600px) {
  .chat {
    height: 95vh;
    border-radius: 16px;
  }

  .msg {
    max-width: 90%;
  }

  .online {
    display: none;
  }

  button {
    padding: 0 16px;
  }
}
</style>
</head>

<body>

<div class="chat">

  <div class="header">
    <div class="logo">👽</div>

    <div>
      <div class="title">MyZubster AI</div>
      <div class="subtitle">
        Assistente AI locale · Ollama · Qwen 2.5 3B
      </div>
    </div>

    <div class="online" id="online">
      ● ONLINE
    </div>
  </div>

  <div class="messages" id="messages">

    <div class="msg bot">
👽 Ciao! Sono MyZubster AI.

Sono l'assistente AI locale del progetto MyZubster.

Scrivimi qualcosa per iniziare.
    </div>

  </div>

  <div class="input">

    <textarea
      id="message"
      placeholder="Scrivi qui il tuo messaggio..."
    ></textarea>

    <button id="send">Invia 🚀</button>

  </div>

</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('message');
const send = document.getElementById('send');
const online = document.getElementById('online');

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text || send.disabled) {
    return;
  }

  addMessage(text, 'user');

  input.value = '';
  send.disabled = true;

  const thinking = addMessage(
    '👽 MyZubster AI sta pensando...',
    'bot'
  );

  try {

    const response = await fetch('/api/grok/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    thinking.remove();

    if (!response.ok || !data.ok) {
      throw new Error(
        typeof data.error === 'string'
          ? data.error
          : JSON.stringify(data.error || 'Errore AI')
      );
    }

    addMessage(
      data.response || data.message || 'Nessuna risposta.',
      'bot'
    );

    online.textContent = '● ONLINE';

  } catch (error) {

    thinking.remove();

    addMessage(
      '❌ Errore: ' + error.message,
      'bot'
    );

    online.textContent = '● ERRORE';

  } finally {

    send.disabled = false;
    input.focus();

  }
}

send.addEventListener('click', sendMessage);

input.addEventListener('keydown', function(e) {

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }

});

input.focus();
</script>

</body>
</html>
