<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Conoscenze pubbliche · MyZubster</title><meta name="description" content="Esplora le schede Conoscenze pubblicate dai partecipanti MyZubster, con dichiarazioni e fonti distinte.">
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28205a,#0c0b20 60%);color:#f8fafc;font:16px/1.5 Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}a{color:#7dd3fc}.muted{color:#cbd5e1}.panel,.card{background:#16152e;border:1px solid #475569;border-radius:18px;padding:20px;margin:16px 0}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}label{display:block;font-size:14px;color:#cbd5e1}input,select{width:100%;padding:11px;margin-top:5px;background:#090b19;color:white;border:1px solid #64748b;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{margin:0;display:flex;flex-direction:column}.card h2{font-size:1.2rem;margin:7px 0}.card p{overflow-wrap:anywhere;white-space:pre-wrap}.tag{color:#fef08a;font-size:13px}.source{margin-top:auto}.button{display:inline-block;padding:9px 12px;border-radius:10px;background:#4338ca;color:white;text-decoration:none;font-weight:bold}.button:hover{background:#6366f1}@media(max-width:700px){.filters{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><p><a href="/">← MyZubster</a> · <a href="/zorgax-profile-builder">Crea la tua scheda</a></p><h1>Conoscenze della comunità</h1><p class="muted">Schede pubblicate dai titolari. Una dichiarazione e un link a una fonte non equivalgono a una verifica indipendente. Apri una scheda per leggere la nota sullo stato della verifica.</p>
<section class="panel" aria-label="Filtri del catalogo"><div class="filters"><label>Cerca titolo, testo o fonte<input id="search" type="search" placeholder="Es. Docker, trasporti, Nicola"></label><label>Ambito<select id="domain"><option value="">Tutti gli ambiti</option></select></label><label>Account<select id="owner"><option value="">Tutti gli account</option></select></label></div><p id="status" class="muted" role="status">Caricamento delle schede…</p></section><div id="cards" class="grid"></div></main>
<script>
const cardsEl=document.getElementById('cards'),statusEl=document.getElementById('status'),searchEl=document.getElementById('search'),domainEl=document.getElementById('domain'),ownerEl=document.getElementById('owner');let all=[];
function add(tag,value,parent){const el=document.createElement(tag);el.textContent=value;parent.appendChild(el);return el}
function options(select,values){for(const value of [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'))){const option=document.createElement('option');option.value=value;option.textContent=value;select.appendChild(option)}}
function render(){const query=searchEl.value.trim().toLocaleLowerCase('it');const visible=all.filter(card=>(!ownerEl.value||card.publisherName===ownerEl.value)&&(!domainEl.value||card.domain===domainEl.value)&&(!query||[card.title,card.description,card.publisherName,card.domain,card.verificationNote,...(card.evidence||[]).flatMap(e=>[e.label,e.note,e.url])].join(' ').toLocaleLowerCase('it').includes(query)));cardsEl.replaceChildren();statusEl.textContent=visible.length+' schede pubbliche trovate'+(all.length?' su '+all.length:'')+'.';for(const card of visible){const article=document.createElement('article');article.className='card';cardsEl.appendChild(article);add('span','Dichiarazione del titolare · fonti non verificate automaticamente',article).className='tag';add('h2',card.title,article);add('p','Account: '+(card.publisherName||'MyZubster')+' · Ambito: '+card.domain,article).className='muted';add('p',card.description.length>250?card.description.slice(0,247)+'…':card.description,article);add('p',(card.evidence||[]).length+' fonti indicate · '+(card.verificationNote?'nota sulla verifica presente':'nessuna nota di verifica'),article).className='muted source';const link=document.createElement('a');link.className='button';link.href='/knowledge-card?id='+encodeURIComponent(card._id);link.textContent='Apri scheda e fonti';article.appendChild(link)}}
async function load(){try{const response=await fetch('/api/knowledge-evidence/public',{cache:'no-store'});if(!response.ok)throw new Error('Catalogo temporaneamente non disponibile');const data=await response.json();all=data.cards||[];options(domainEl,all.map(x=>x.domain));options(ownerEl,all.map(x=>x.publisherName));const requestedOwner=new URLSearchParams(location.search).get('owner');if(requestedOwner&&[...ownerEl.options].some(x=>x.value===requestedOwner))ownerEl.value=requestedOwner;render()}catch(error){statusEl.textContent=error.message}}
for(const element of [searchEl,domainEl,ownerEl])element.addEventListener(element===searchEl?'input':'change',render);load();
</script></body></html>
