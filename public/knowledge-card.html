<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scheda Conoscenze · MyZubster</title>
<style>body{margin:0;background:#0e0c25;color:#f8fafc;font:16px/1.6 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#17152f;border:1px solid #475569;border-radius:18px;padding:24px;margin:20px 0}a{color:#7dd3fc;overflow-wrap:anywhere}.muted{color:#cbd5e1}.tag{display:inline-block;background:#334155;border-radius:20px;padding:4px 10px}.source{margin:12px 0;padding:12px;background:#0e0c25;border-radius:10px}h1,h2{line-height:1.2}p{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main class="wrap"><p><a href="/knowledge">← Catalogo Conoscenze</a> · <a href="/zorgax-profile-builder">Crea una scheda</a></p><article class="card" id="card"><p>Caricamento scheda…</p></article></main>
<script>
const box=document.getElementById('card');
function el(tag,value,parent){const node=document.createElement(tag);node.textContent=value;parent.appendChild(node);return node}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!/^[0-9a-f]{24}$/i.test(id||'')){box.textContent='Scheda non trovata.';return}try{const r=await fetch('/api/knowledge-evidence/public/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error('Scheda non disponibile o ritirata.');const {card}=await r.json();box.replaceChildren();el('span','Scheda pubblica · dichiarazioni del titolare',box).className='tag';el('h1',card.title,box);el('p','Account: '+(card.publisherName||'Titolare MyZubster'),box).className='muted';el('p','Ambito: '+card.domain,box);el('h2','Attività e conoscenze dichiarate',box);el('p',card.description,box);el('h2','Fonti indicate',box);if(!card.evidence?.length)el('p','Nessuna fonte indicata.',box);for(const evidence of card.evidence||[]){const section=document.createElement('div');section.className='source';box.appendChild(section);el('strong',evidence.label,section);if(evidence.url){const link=document.createElement('a');link.href=evidence.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=evidence.url;section.appendChild(document.createElement('br'));section.appendChild(link)}if(evidence.note)el('p',evidence.note,section)}el('h2','Stato della verifica',box);el('p',card.verificationNote||'Nessuna verifica indipendente dichiarata.',box);el('p','Le fonti sono indicate dal titolare. MyZubster non ne certifica automaticamente contenuto, proprietà o competenze.',box).className='muted';if(card.publishedAt)el('p','Pubblicata il '+new Date(card.publishedAt).toLocaleDateString('it-IT'),box).className='muted'}catch(e){box.textContent=e.message}}
load();
</script></body></html>
