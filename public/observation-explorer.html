<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyZubster Observation Explorer</title>
<meta name="description" content="Explore geolocated MyZubster observations from the public observation registry.">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0f14;color:#eef2f7}header{padding:30px 20px;background:#101722;border-bottom:1px solid #293442}header .inner,main{max-width:1180px;margin:auto}nav a{color:#9fd3ff;text-decoration:none;margin-right:16px}.lead{color:#9aa6b2;max-width:760px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stat,.card{background:#121923;border:1px solid #293442;border-radius:14px}.stat{padding:10px 14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{background:#0e151e;color:#eef2f7;border:1px solid #344252;border-radius:9px;padding:11px 12px;font:inherit}input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{overflow:hidden}.card img{width:100%;height:190px;object-fit:cover;background:#070a0e}.copy{padding:15px}.badge{display:inline-block;border:1px solid #53677d;border-radius:999px;padding:4px 8px;font-size:.75rem;margin:0 4px 6px 0}.muted{color:#9aa6b2}.coords{font-family:monospace;font-size:.85rem;word-break:break-all}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.button{display:inline-block;padding:8px 10px;border-radius:8px;background:#dcecff;color:#08111b;text-decoration:none;font-weight:700;font-size:.86rem}.empty{padding:30px;border:1px dashed #44515f;border-radius:14px;color:#9aa6b2;text-align:center}footer{text-align:center;padding:35px;color:#74808b}@media(max-width:600px){header{padding:22px 16px}main{padding:0 16px}}
</style></head>
<body><header><div class="inner"><nav><a href="/">Home</a><a href="/photos.html">Photos</a><a href="/ecosystem-dashboard.html">Dashboard</a></nav><h1>Observation Explorer</h1><p class="lead">A live geographic index generated from the MyZubster observation registry. Only observations with recorded coordinates are shown here; missing location data is never guessed.</p></div></header>
<main><div id="stats" class="stats"></div><div class="toolbar"><input id="search" type="search" placeholder="Search title, category, tags…"><select id="category"><option value="">All categories</option></select></div><div id="grid" class="grid"><div class="empty">Loading observations…</div></div></main><footer>MyZubster — observe, document and connect the real world.</footer>
<script>
const grid=document.getElementById('grid'),stats=document.getElementById('stats'),search=document.getElementById('search'),category=document.getElementById('category');let rows=[];const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function hasGPS(o){return Number.isFinite(o.latitude)&&Number.isFinite(o.longitude)}
function render(){const q=search.value.trim().toLowerCase(),cat=category.value;const filtered=rows.filter(o=>(!cat||o.category===cat)&&(!q||[o.title,o.description,o.category,...(o.tags||[])].join(' ').toLowerCase().includes(q)));stats.innerHTML=`<div class="stat"><strong>${rows.length}</strong> geolocated</div><div class="stat"><strong>${filtered.length}</strong> visible</div>`;if(!filtered.length){grid.innerHTML='<div class="empty">No geolocated observations match these filters.</div>';return}grid.innerHTML=filtered.map(o=>{const map=`https://www.google.com/maps?q=${encodeURIComponent(o.latitude)},${encodeURIComponent(o.longitude)}`;return `<article class="card"><img src="${esc(o.media_path)}" alt="${esc(o.title)}"><div class="copy"><span class="badge">${esc(o.category)}</span><span class="badge">${esc(o.status)}</span><h2>${esc(o.title)}</h2><p class="muted">${esc(o.description||'')}</p><div class="coords">${esc(o.latitude)}, ${esc(o.longitude)}</div><div class="actions"><a class="button" href="/observation.html?id=${encodeURIComponent(o.observation_id)}">Details</a><a class="button" href="${map}" target="_blank" rel="noopener noreferrer">Open in Maps</a></div></div></article>`}).join('')}
fetch('/data/observations.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(data=>{const all=data.observations||[];rows=all.filter(hasGPS);[...new Set(rows.map(o=>o.category).filter(Boolean))].sort().forEach(c=>category.insertAdjacentHTML('beforeend',`<option value="${esc(c)}">${esc(c)}</option>`));stats.innerHTML=`<div class="stat"><strong>${all.length}</strong> registry records</div><div class="stat"><strong>${rows.length}</strong> geolocated</div><div class="stat"><strong>${all.length-rows.length}</strong> awaiting GPS</div>`;render()}).catch(e=>grid.innerHTML=`<div class="empty">Unable to load observation registry: ${esc(e.message)}</div>`);search.addEventListener('input',render);category.addEventListener('change',render);
</script></body></html>
