version: "3.8"

services:
  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    container_name: myzubster-registry
    environment:
      - REGISTRY_PORT=8500
    ports:
      - "8500:8500"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: myzubster-gateway
    environment:
      - GATEWAY_PORT=8080
      - REGISTRY_HOST=registry
      - REGISTRY_PORT=8500
    ports:
      - "8080:8080"
    depends_on:
      - registry
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: myzubster-auth
    environment:
      - AUTH_PORT=8081
      - SERVICE_HOST=auth
      - REGISTRY_HOST=registry
      - REGISTRY_PORT=8500
    depends_on:
      - registry
    restart: unless-stopped

  gardens:
    build:
      context: .
      dockerfile: services/gardens/Dockerfile
    container_name: myzubster-gardens
    environment:
      - GARDENS_PORT=8082
      - SERVICE_HOST=gardens
      - REGISTRY_HOST=registry
      - REGISTRY_PORT=8500
    depends_on:
      - registry
    restart: unless-stopped

  bounties:
    build:
      context: .
      dockerfile: services/bounties/Dockerfile
    container_name: myzubster-bounties
    environment:
      - BOUNTIES_PORT=8083
      - SERVICE_HOST=bounties
      - REGISTRY_HOST=registry
      - REGISTRY_PORT=8500
    depends_on:
      - registry
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: myzubster-ai
    environment:
      - AI_PORT=8084
      - SERVICE_HOST=ai
      - REGISTRY_HOST=registry
      - REGISTRY_PORT=8500
    depends_on:
      - registry
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    container_name: myzubster-notifications
    environment:
      - NOTIFICATIONS_PORT=8085
      - SERVICE_HOST=notifications
      - REGISTRY_HOST=registry
      - REGISTRY_PORT=8500
    depends_on:
      - registry
    restart: unless-stopped
