version: '3.8'

services:
  # ─── API Gateway ───────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:3001
      - GARDEN_SERVICE_URL=http://garden-service:3002
      - BOUNTY_SERVICE_URL=http://bounty-service:3003
      - NFT_SERVICE_URL=http://nft-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
    depends_on:
      - auth-service
      - garden-service
      - bounty-service
      - nft-service
      - notification-service
    networks:
      - myzubster-net

  # ─── Auth Service ──────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: auth
    ports:
      - "3001:3001"
    environment:
      - SERVICE_PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/myzubster-auth
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      - mongo
    networks:
      - myzubster-net

  # ─── Garden Service ────────────────────────────────────────
  garden-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: garden
    ports:
      - "3002:3002"
    environment:
      - SERVICE_PORT=3002
      - MONGODB_URI=mongodb://mongo:27017/myzubster-gardens
    depends_on:
      - mongo
    networks:
      - myzubster-net

  # ─── Bounty Service ────────────────────────────────────────
  bounty-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: bounty
    ports:
      - "3003:3003"
    environment:
      - SERVICE_PORT=3003
      - MONGODB_URI=mongodb://mongo:27017/myzubster-bounties
    depends_on:
      - mongo
    networks:
      - myzubster-net

  # ─── NFT Service ───────────────────────────────────────────
  nft-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: nft
    ports:
      - "3004:3004"
    environment:
      - SERVICE_PORT=3004
      - MONGODB_URI=mongodb://mongo:27017/myzubster-nfts
    depends_on:
      - mongo
    networks:
      - myzubster-net

  # ─── Notification Service ──────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: notification
    ports:
      - "3005:3005"
    environment:
      - SERVICE_PORT=3005
      - MONGODB_URI=mongodb://mongo:27017/myzubster-notifications
    depends_on:
      - mongo
    networks:
      - myzubster-net

  # ─── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - myzubster-net

  # ─── Redis (Service Discovery / Cache) ────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - myzubster-net

volumes:
  mongo-data:
  redis-data:

networks:
  myzubster-net:
    driver: bridge
